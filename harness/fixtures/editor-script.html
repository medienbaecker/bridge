<meta charset="utf-8">
<title>Demo: the script</title>
<style>
:root {
  --paper: Canvas;
  --ink: CanvasText;
  --ink-soft: color-mix(in srgb, CanvasText 72%, transparent);
  --ink-faint: color-mix(in srgb, CanvasText 45%, transparent);
  --rule: color-mix(in srgb, CanvasText 14%, transparent);
  --rule-strong: color-mix(in srgb, CanvasText 30%, transparent);
  --accent: AccentColor;
  --warn: color-mix(in srgb, #c98a12 80%, CanvasText);
  --bad: color-mix(in srgb, #d0453b 80%, CanvasText);
}

.howto { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-faint); }
.howto summary { cursor: default; list-style: none; color: var(--ink-faint); }
.howto summary::-webkit-details-marker { display: none; }
.howto summary::before { content: "?"; display: inline-grid; place-items: center;
  width: 15px; height: 15px; margin-right: 6px; border-radius: 50%;
  border: 1px solid var(--rule-strong); font-size: 10px; }
.howto[open] summary { color: var(--ink-soft); }
.howto p { margin: 6px 0 0 21px; line-height: 1.5; }
.howto kbd { font: inherit; border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }

  .tools { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 8px 0; background: var(--paper); border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--ink-faint); }
  .tools .bar { margin-left: auto; display: flex; gap: 14px; }
  .tools .bar b { color: var(--ink); }
  .page { max-width: 816px; padding-left: 56px; box-sizing: border-box; }
  #doc { position: relative; padding: 28px 0 45vh; font-size: 19px; line-height: 1.55; outline: none; }
  #doc p, #doc div { margin: 0 0 22px; min-height: 1.55em; contain: layout; }
  #doc h2 { font-size: 28px; font-weight: 700; margin: 44px 0 14px; padding: 0; border: 0; }
  #doc > :first-child { margin-top: 0; }
  .plus { position: absolute; left: -52px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink-soft); font-size: 22px; line-height: 1; display: none; place-items: center; cursor: pointer; z-index: 2; }
  .plus.on { display: grid; }
  .plus:hover { border-color: var(--ink); color: var(--ink); }
  .menu { position: absolute; left: -12px; display: none; gap: 6px; z-index: 3; padding: 6px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .menu.on { display: flex; }
  .menu button { font-size: 12px; }
  .th { position: relative; display: inline-block; vertical-align: middle; width: 180px; aspect-ratio: 16/10; margin: 2px 6px 2px 0; border-radius: 3px; overflow: hidden; background: #000; cursor: grab; user-select: none; contain: layout paint; }
  .th.dragging { opacity: .35; }
  .drop-mark { display: inline-block; width: 3px; height: 1.2em; vertical-align: middle; background: var(--accent); border-radius: 2px; }
  .th img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .th span { position: absolute; left: 4px; bottom: 4px; font-size: 11px; padding: 2px 5px; border-radius: 2px; background: rgba(0,0,0,.7); color: #fff; }
  .th .x { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; line-height: 1; background: rgba(0,0,0,.7); color: #fff; cursor: pointer; opacity: 0; }
  .th:hover .x { opacity: 1; }
  .th.built { outline: 1.5px solid var(--accent); }
  .th.broken { border: 1.5px solid var(--bad); background: transparent; }
  .th.broken .t { padding: 10px; font-size: 12px; color: var(--bad); }
  .th.state span { background: var(--ink); }
  .th.built span { background: var(--accent); color: var(--paper); }
  .th.draft { border: 1.5px dashed var(--accent); background: transparent; transition: width .15s; }
  .th.draft:focus-within { width: 100%; aspect-ratio: auto; min-height: 120px; display: block; margin: 6px 0; }
  .th.draft:focus-within .t { font-size: 15px; line-height: 1.5; padding: 12px 14px 28px; height: auto; min-height: 96px; overflow: visible; }
  .th.draft .t { padding: 8px 10px 22px; font-size: 12.5px; line-height: 1.35; white-space: pre-wrap; outline: none; height: 100%; overflow: auto; user-select: text; cursor: text; }
  .th.draft .t:empty::before { content: 'what is in this item?'; color: var(--ink-faint); }
  .th.draft span { background: var(--accent); color: var(--paper); }
  .th.dup { outline: 2px solid var(--warn); }
  .th.sel { outline: 2px solid var(--ink); }
  .big { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(0,0,0,.88); cursor: zoom-out; }
  .big.on { display: grid; }
  .big img { max-width: 92vw; max-height: 82vh; border-radius: 4px; }
  .big p { margin: 10px 0 0; color: #fff; font-size: 14px; text-align: center; }
  .picker { width: min(96vw, 1400px); max-height: 90vh; overflow: auto; padding: 16px; border-radius: 10px; background: var(--paper); cursor: default; }
  .picker h2 { margin: 0 0 10px; font-size: 13px; }
  .picker .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
  .picker .th { width: auto; margin: 0; cursor: copy; display: block; }
  .picker .th.used { opacity: .35; }
  .picker .th:hover, .picker .th:focus-visible { outline: 2px solid var(--accent); }
  .picker .th i { position: absolute; inset: auto 0 0 0; padding: 3px 5px; font-size: 10.5px; line-height: 1.2; background: rgba(0,0,0,.72); color: #fff; font-style: normal; }
  .picker .th span { bottom: auto; top: 4px; }
  #lock { display: none; margin: 10px 0; padding: 10px 14px; border-radius: 8px; background: #b3261e; color: #fff; font-size: 14px; }
  body.locked #doc { opacity: .75; }
</style>

<div class="page">
  <details class="howto">
    <summary>How this works</summary>
    <p>Write. On an empty line a <b>+</b> appears: item, block, or part.
    <kbd>⌘K</kbd> picks an item anywhere. Click an image to see it big, hover it for ×.</p>
  </details>
  <div class="tools">
    <span class="bar" id="bar"></span>
  </div>
  <div style="position: relative">
    <button type="button" class="plus" id="plus" aria-label="Insert">+</button>
    <div class="menu" id="menu"><button type="button" id="pick">item</button><button type="button" id="draft">block</button><button type="button" id="section">part</button></div>
    <div id="doc" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off" writingsuggestions="false" aria-label="The document"></div>
  </div>
  <div class="big" id="big"></div>
</div>
